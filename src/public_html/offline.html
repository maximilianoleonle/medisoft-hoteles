<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sin conexion</title>
    <style>
        :root {
            --brand-primary: #1B2746;
            --brand-secondary: #0F172A;
            --brand-accent: #BD9441;
            --offline-paper: #FFFDF8;
            --offline-bg: #F7F2EA;
            --offline-ink: #172033;
            --offline-muted: #687386;
            --offline-line: #E6DCCB;
        }

        * {
            box-sizing: border-box;
        }

        html {
            touch-action: pan-x pan-y;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 22px;
            display: grid;
            place-items: center;
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--offline-ink);
            background:
                radial-gradient(circle at 82% 12%, color-mix(in srgb, var(--brand-accent) 18%, transparent), transparent 30rem),
                radial-gradient(circle at 12% 84%, color-mix(in srgb, var(--brand-primary) 12%, transparent), transparent 28rem),
                linear-gradient(180deg, color-mix(in srgb, var(--brand-primary) 5%, var(--offline-bg)), var(--offline-paper));
        }

        .offline-card {
            width: min(520px, 100%);
            border: 1px solid color-mix(in srgb, var(--brand-primary) 13%, var(--offline-line));
            border-radius: 22px;
            background: color-mix(in srgb, var(--brand-accent) 3%, var(--offline-paper));
            box-shadow: 0 34px 90px -42px color-mix(in srgb, var(--brand-secondary) 65%, rgba(15, 23, 42, .55));
            overflow: hidden;
        }

        .offline-header {
            padding: 26px 26px 22px;
            text-align: center;
            background:
                radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--brand-accent) 18%, transparent), transparent 58%),
                linear-gradient(180deg, color-mix(in srgb, var(--brand-primary) 7%, #FFFDF8), #FFFDF8);
            border-bottom: 1px solid color-mix(in srgb, var(--brand-primary) 12%, var(--offline-line));
        }

        .logo-shell {
            width: 104px;
            height: 104px;
            margin: 0 auto 16px;
            display: grid;
            place-items: center;
            border-radius: 26px;
            background: #fff;
            border: 1px solid color-mix(in srgb, var(--brand-primary) 12%, var(--offline-line));
            box-shadow: 0 18px 40px -30px color-mix(in srgb, var(--brand-primary) 70%, transparent);
        }

        .logo {
            width: 78px;
            max-height: 78px;
            object-fit: contain;
        }

        .logo[hidden],
        .logo-fallback[hidden] {
            display: none !important;
        }

        .logo-fallback {
            width: 78px;
            height: 78px;
            border-radius: 22px;
            display: grid;
            place-items: center;
            color: #FFFDF8;
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            font-size: 1.25rem;
            font-weight: 950;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 30px;
            padding: 0 12px;
            border-radius: 999px;
            color: color-mix(in srgb, var(--brand-secondary) 78%, #111827);
            background: color-mix(in srgb, var(--brand-accent) 16%, #fff);
            border: 1px solid color-mix(in srgb, var(--brand-accent) 34%, var(--offline-line));
            font-size: .76rem;
            font-weight: 900;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: #D92D20;
            box-shadow: 0 0 0 5px rgba(217, 45, 32, .12);
        }

        h1 {
            margin: 18px 0 8px;
            color: var(--offline-ink);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2rem, 8vw, 3rem);
            line-height: .96;
            letter-spacing: 0;
        }

        .hotel-name {
            margin: 0;
            color: color-mix(in srgb, var(--brand-primary) 82%, var(--offline-ink));
            font-size: .95rem;
            font-weight: 900;
        }

        .offline-body {
            padding: 22px 26px 26px;
        }

        .offline-body p {
            margin: 0;
            color: var(--offline-muted);
            font-size: .98rem;
            line-height: 1.55;
            font-weight: 650;
        }

        .offline-note {
            margin-top: 16px;
            border: 1px solid color-mix(in srgb, var(--brand-primary) 11%, var(--offline-line));
            border-radius: 16px;
            padding: 13px 14px;
            background: color-mix(in srgb, var(--brand-primary) 4%, #fff);
            color: color-mix(in srgb, var(--brand-secondary) 76%, var(--offline-ink));
            font-size: .86rem;
            line-height: 1.45;
            font-weight: 760;
        }

        .retry-button {
            width: 100%;
            min-height: 46px;
            margin-top: 20px;
            border: 0;
            border-radius: 13px;
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            color: #FFFDF8;
            font-size: .95rem;
            font-weight: 950;
            cursor: pointer;
            box-shadow: 0 18px 34px -26px color-mix(in srgb, var(--brand-primary) 78%, transparent);
            transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
        }

        .retry-button:hover {
            filter: brightness(1.04);
            transform: translateY(-1px);
            box-shadow: 0 22px 40px -28px color-mix(in srgb, var(--brand-primary) 88%, transparent);
        }

        .retry-button:active {
            transform: translateY(0) scale(.99);
        }

        @media (max-width: 520px) {
            body {
                padding: 12px;
            }

            .offline-card {
                border-radius: 20px;
            }

            .offline-header,
            .offline-body {
                padding-left: 18px;
                padding-right: 18px;
            }
        }
    </style>
    <script>
        (function() {
            var lastTouchEnd = 0;
            function blockZoom(event) {
                if (event.cancelable) {
                    event.preventDefault();
                }
            }

            document.addEventListener('gesturestart', blockZoom, { passive: false });
            document.addEventListener('gesturechange', blockZoom, { passive: false });
            document.addEventListener('gestureend', blockZoom, { passive: false });
            document.addEventListener('touchmove', function(event) {
                if (event.touches && event.touches.length > 1) {
                    blockZoom(event);
                }
            }, { passive: false });
            document.addEventListener('touchend', function(event) {
                var now = Date.now();
                if (now - lastTouchEnd <= 300) {
                    blockZoom(event);
                }
                lastTouchEnd = now;
            }, { passive: false });
        })();
    </script>
</head>
<body>
    <main class="offline-card" aria-labelledby="offline-title">
        <section class="offline-header">
            <div class="logo-shell">
                <img id="hotelLogo" alt="" class="logo" hidden>
                <span id="hotelLogoFallback" class="logo-fallback" aria-hidden="true">MH</span>
            </div>
            <span class="status-pill">
                <span class="status-dot" aria-hidden="true"></span>
                Sin internet
            </span>
            <h1 id="offline-title">Sin conexion</h1>
            <p id="hotelName" class="hotel-name">Medisoft Hoteles</p>
        </section>

        <section class="offline-body">
            <p>
                No se pudo conectar con el servidor. Revisa tu conexion y vuelve a intentarlo.
            </p>
            <div class="offline-note">
                Cuando la conexion regrese, el sistema intentara cargar nuevamente la informacion del hotel.
            </div>
            <button class="retry-button" type="button" onclick="window.location.reload()">
                Reintentar conexion
            </button>
        </section>
    </main>

    <script>
        (function () {
            var fallback = {
                name: 'Medisoft Hoteles',
                logo: '/img/logo.png',
                primary: '#1B2746',
                secondary: '#0F172A',
                accent: '#BD9441'
            };

            function isHex(value) {
                return /^#[0-9A-Fa-f]{6}$/.test(String(value || '').trim());
            }

            function safeAssetUrl(value) {
                var text = String(value || '').trim();
                if (!text || /[\u0000-\u001F<>"']/.test(text)) {
                    return '';
                }

                var lower = text.toLowerCase();
                if (lower.indexOf('javascript:') === 0 || lower.indexOf('data:') === 0 || lower.indexOf('file:') === 0) {
                    return '';
                }

                if (text.charAt(0) === '/') {
                    return text;
                }

                try {
                    var url = new URL(text, window.location.origin);
                    return url.origin === window.location.origin ? url.pathname + url.search : '';
                } catch (error) {
                    return '';
                }
            }

            function loadBranding() {
                try {
                    var stored = JSON.parse(window.localStorage.getItem('medisoft:offline-branding') || '{}');
                    var hasStoredBranding = Boolean(stored && (stored.hotelId || stored.slug || stored.name || stored.logo || stored.pwaIcon192 || stored.pwaIcon512));
                    return {
                        name: String(stored.name || fallback.name).trim() || fallback.name,
                        logo: safeAssetUrl(stored.logo) || safeAssetUrl(stored.pwaIcon192) || safeAssetUrl(stored.pwaIcon512) || fallback.logo,
                        primary: isHex(stored.primary) ? stored.primary : fallback.primary,
                        secondary: isHex(stored.secondary) ? stored.secondary : fallback.secondary,
                        accent: isHex(stored.accent) ? stored.accent : fallback.accent,
                        fromStorage: hasStoredBranding
                    };
                } catch (error) {
                    return fallback;
                }
            }

            function initialsFromName(value) {
                var words = String(value || fallback.name)
                    .trim()
                    .split(/\s+/)
                    .filter(Boolean);

                if (!words.length) {
                    return 'MH';
                }

                return words
                    .slice(0, 2)
                    .map(function (word) { return word.charAt(0); })
                    .join('')
                    .toUpperCase();
            }

            var branding = loadBranding();
            var root = document.documentElement;
            root.style.setProperty('--brand-primary', branding.primary);
            root.style.setProperty('--brand-secondary', branding.secondary);
            root.style.setProperty('--brand-accent', branding.accent);

            document.title = 'Sin conexion - ' + branding.name;

            var hotelName = document.getElementById('hotelName');
            if (hotelName) {
                hotelName.textContent = branding.name;
            }

            var logo = document.getElementById('hotelLogo');
            var logoFallback = document.getElementById('hotelLogoFallback');
            if (logoFallback) {
                logoFallback.textContent = initialsFromName(branding.name);
            }

            if (logo) {
                logo.alt = branding.name;
                logo.onload = function () {
                    logo.hidden = false;
                    if (logoFallback) {
                        logoFallback.hidden = true;
                    }
                };
                logo.onerror = function () {
                    logo.hidden = true;
                    if (logoFallback) {
                        logoFallback.hidden = false;
                    }
                };
                logo.src = branding.logo;
            }

            window.addEventListener('online', function () {
                setTimeout(function () {
                    window.location.reload();
                }, 700);
            });

        })();
    </script>
</body>
</html>
