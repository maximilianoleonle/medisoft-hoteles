services:
  app:
    build:
      context: ./docker/php
    container_name: medisoft_hoteles_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-medisoft_hoteles}
      DB_USER: ${DB_USER:-medisoft_user}
      DB_PASS: ${DB_PASS:-medisoft_pass}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: medisoft_hoteles_db
    restart: unless-stopped
    ports:
      - "${MYSQL_EXTERNAL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-medisoft_hoteles}
      MYSQL_USER: ${DB_USER:-medisoft_user}
      MYSQL_PASSWORD: ${DB_PASS:-medisoft_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_pass}
    volumes:
      - medisoft_mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS:-root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: medisoft_hoteles_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_pass}
      UPLOAD_LIMIT: 128M
    depends_on:
      db:
        condition: service_healthy

volumes:
  medisoft_mysql_data:
