# Rotacion de logs de docker: sin limite crecen hasta llenar el disco
# (causa #1 de caidas tontas de VPS). 10MB x 3 archivos por servicio.
x-logging: &log-rotado
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *log-rotado
    build:
      context: ./docker/php
    container_name: medisoft_hoteles_app
    restart: unless-stopped
    ports:
      # Solo loopback por defecto (Fase 2): nada del stack dev se expone a la
      # LAN. Para habilitar acceso LAN deliberado: DEV_BIND=0.0.0.0 en .env.
      - "${DEV_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html
      - ./docs:/var/www/docs:ro
      - ./migrations:/var/www/migrations:ro
      - ./.env:/var/www/.env:ro
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-medisoft_hoteles}
      DB_USER: ${DB_USER:-medisoft_user}
      DB_PASS: ${DB_PASS:-medisoft_pass}
    depends_on:
      db:
        condition: service_healthy

  db:
    <<: *log-rotado
    image: mysql:8.0
    container_name: medisoft_hoteles_db
    restart: unless-stopped
    # Tuning por flags (NO por my.cnf montado: en Windows el bind mount queda
    # world-writable y MySQL lo ignora). La palanca principal es el buffer
    # pool (memoria de trabajo de InnoDB); en produccion subirlo a ~50-60% de
    # la RAM del servidor. flush_log_at_trx_commit=1 NO se relaja: sistema
    # financiero (caja/CxC/CxP/nomina), cero perdida ante corte de luz.
    command:
      - --innodb-buffer-pool-size=512M
      - --innodb-redo-log-capacity=256M
      - --innodb-flush-log-at-trx-commit=1
      - --max-connections=200
      - --tmp-table-size=64M
      - --max-heap-table-size=64M
      - --table-open-cache=2000
      - --skip-name-resolve
      - --slow-query-log=1
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --long-query-time=0.5
    ports:
      - "${DEV_BIND:-127.0.0.1}:${MYSQL_EXTERNAL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-medisoft_hoteles}
      MYSQL_USER: ${DB_USER:-medisoft_user}
      MYSQL_PASSWORD: ${DB_PASS:-medisoft_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_pass}
    volumes:
      - medisoft_mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS:-root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    <<: *log-rotado
    image: phpmyadmin/phpmyadmin
    container_name: medisoft_hoteles_phpmyadmin
    restart: unless-stopped
    ports:
      - "${DEV_BIND:-127.0.0.1}:${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_pass}
      UPLOAD_LIMIT: 128M
    depends_on:
      db:
        condition: service_healthy

volumes:
  medisoft_mysql_data:
