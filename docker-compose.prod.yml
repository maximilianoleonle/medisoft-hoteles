# Compose de PRODUCCION — Medisoft Hoteles
# Diferencias vs desarrollo:
#  - Caddy al frente: HTTPS automatico (Let's Encrypt) y unico expuesto (80/443).
#  - app SIN puerto publicado (solo via Caddy).
#  - MySQL SIN puerto publicado (solo red interna).
#  - SIN phpMyAdmin (administrar BD por tunel SSH: ssh -L 3306:localhost:3306).
#
# Uso en el servidor:
#   APP_DOMAIN=app.tudominio.com docker compose -f docker-compose.prod.yml up -d --build
# (APP_DOMAIN tambien puede ir en .env)

# Rotacion de logs de docker: sin limite crecen hasta llenar el disco
# (causa #1 de caidas tontas de VPS). 10MB x 3 archivos por servicio.
x-logging: &log-rotado
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  caddy:
    <<: *log-rotado
    image: caddy:2-alpine
    container_name: medisoft_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Definir APP_DOMAIN (ej. app.tudominio.com)}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - medisoft_caddy_data:/data
      - medisoft_caddy_config:/config
    depends_on:
      - app

  app:
    <<: *log-rotado
    build:
      context: ./docker/php
    container_name: medisoft_hoteles_app
    restart: unless-stopped
    # Sin ports: solo Caddy le habla por la red interna.
    volumes:
      - ./src:/var/www/html
      - ./docs:/var/www/docs:ro
      - ./migrations:/var/www/migrations:ro
      - ./.env:/var/www/.env:ro
      # Endurecimiento PHP solo-produccion: errores fuera de pantalla,
      # cookie de sesion Secure, OPcache menos agresivo revalidando.
      - ./docker/php/php-prod.ini:/usr/local/etc/php/conf.d/zz-php-prod.ini:ro
    env_file:
      - .env
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-medisoft_hoteles}
      DB_USER: ${DB_USER:-medisoft_user}
      DB_PASS: ${DB_PASS:?Definir DB_PASS fuerte en .env}
    depends_on:
      db:
        condition: service_healthy

  db:
    <<: *log-rotado
    image: mysql:8.0
    container_name: medisoft_hoteles_db
    restart: unless-stopped
    # Sin ports: la BD no se expone a internet.
    # Tuning por flags (mismo bloque que en dev; ver comentario alla).
    # MYSQL_BUFFER_POOL: subir en .env segun la RAM del servidor
    # (~50-60% si MySQL comparte maquina con PHP; ej. 2G en un VPS de 4 GB).
    command:
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-1G}
      - --innodb-redo-log-capacity=256M
      - --innodb-flush-log-at-trx-commit=1
      - --max-connections=200
      - --tmp-table-size=64M
      - --max-heap-table-size=64M
      - --table-open-cache=2000
      - --skip-name-resolve
      - --slow-query-log=1
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --long-query-time=0.5
    environment:
      MYSQL_DATABASE: ${DB_NAME:-medisoft_hoteles}
      MYSQL_USER: ${DB_USER:-medisoft_user}
      MYSQL_PASSWORD: ${DB_PASS:?Definir DB_PASS fuerte en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?Definir DB_ROOT_PASS fuerte en .env}
    volumes:
      - medisoft_mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  medisoft_mysql_data:
  medisoft_caddy_data:
  medisoft_caddy_config:
