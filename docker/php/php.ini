; Configuración PHP para entorno local Medisoft Hoteles

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

memory_limit = 512M
max_execution_time = 120
max_input_time = 120

upload_max_filesize = 64M
post_max_size = 64M

date.timezone = America/Mexico_City

default_charset = "UTF-8"

; Sesiones
session.cookie_httponly = 1
session.use_strict_mode = 1

; Logs de errores dentro del contenedor
log_errors = On
error_log = /var/log/php_errors.log

; ── Rendimiento ──────────────────────────────────────────────────────────
; OPcache (cache de codigo, ya activo en la imagen): dimensionado para el
; tamano real del sistema. revalidate_freq=2 es amigable para desarrollo;
; en produccion, docker-compose.prod.yml monta un ini extra que lo sube.
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 2

; Cache de resolucion de rutas de archivos: gran ganancia con el codigo
; montado por volumen (cada require deja de tocar el filesystem).
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; APCu: cache de datos en memoria compartida entre requests (modulos por
; hotel, permisos de rol — ver app/helpers/cache.php). Desactivado en CLI:
; los helpers degradan a consulta directa.
apc.enabled = 1
apc.shm_size = 64M
apc.enable_cli = 0
