; PHP para PRODUCCION — montado por docker-compose.prod.yml como
; /usr/local/etc/php/conf.d/zz-php-prod.ini (el prefijo zz- garantiza que
; pisa a custom.ini). En desarrollo NO se monta: dev conserva errores en
; pantalla y revalidacion instantanea de archivos.

; ── Errores: NUNCA en pantalla ───────────────────────────────────────────
; Un fatal de PHP con display_errors=On imprime rutas y detalles internos
; al huesped. Aqui van al stderr del contenedor (docker logs, ya rotados
; por el compose) y el manejador global muestra la pagina 500 con request_id.
display_errors = Off
display_startup_errors = Off
error_log = /dev/stderr

; No anunciar la version de PHP en las cabeceras HTTP.
expose_php = Off

; ── Sesiones ─────────────────────────────────────────────────────────────
; Cookie de sesion solo viaja por HTTPS (Caddy termina TLS al frente y la
; app no publica puerto directo).
session.cookie_secure = 1

; ── OPcache ──────────────────────────────────────────────────────────────
; Revalidar archivos a lo mucho cada 60s: tras un deploy los cambios tardan
; hasta 1 minuto en verse (o recrear el contenedor app para efecto
; inmediato). No usamos validate_timestamps=0 porque el codigo entra por
; volumen, no horneado en la imagen.
opcache.revalidate_freq = 60
