# Ajuste del MPM prefork para el VPS de produccion (2 vCPU / 4 GB RAM).
#
# POR QUE: el default de Debian es MaxRequestWorkers 150 y cada worker de
# Apache+PHP pesa ~35 MB medidos -> 150 x 35 MB = ~5.2 GB, MAS RAM de la que
# tiene la maquina (3.9 GB). En operacion normal solo viven 5 workers, asi que
# no se nota; pero ante un pico Apache intentaria escalar hasta 150 y el OOM
# killer se llevaria el proceso mas grande, que es MySQL. Es decir: el default
# convierte un pico de trafico en una caida de base de datos.
#
# Bajar el tope NO reduce capacidad util: con p95 ~160ms, 40 workers atienden
# muchisimo mas de lo que 2 vCPU pueden sostener. Solo evita que la maquina se
# mate a si misma.
#
# Presupuesto de RAM con estos valores:
#   Apache  40 x 35 MB                   ~1.4 GB
#   MySQL   (buffer pool 1G + overhead)  ~1.3 GB
#   SO + Caddy + Docker                  ~0.4 GB
#   ------------------------------------------
#   ~3.1 GB de 3.9 GB, con ~0.8 GB de margen.
#
# Al crecer (mas hoteles o mas RAM), subir MaxRequestWorkers y el buffer pool
# JUNTOS, respetando ese presupuesto. ServerLimit (default 256) no se toca: es
# el unico que exigiria un restart completo en vez de un graceful.
#
# Se monta en conf-enabled/ a proposito: Apache carga mods-enabled ANTES que
# conf-enabled, asi que esto pisa a mpm_prefork.conf sin editarlo.
# Recargar sin cortar servicio:  apachectl -t && apachectl graceful

<IfModule mpm_prefork_module>
    StartServers             5
    MinSpareServers          5
    MaxSpareServers         10
    MaxRequestWorkers       40

    # Los hijos de prefork NO se reciclan por default (MaxConnectionsPerChild 0):
    # cualquier fuga de memoria de PHP se acumula durante dias hasta el proximo
    # restart. Reciclar cada 1000 peticiones acota la fuga sin costo medible.
    MaxConnectionsPerChild  1000
</IfModule>
