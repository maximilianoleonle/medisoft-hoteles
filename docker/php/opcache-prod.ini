; OPcache para PRODUCCION — montado por docker-compose.prod.yml como
; /usr/local/etc/php/conf.d/zz-opcache-prod.ini (el prefijo zz- garantiza
; que pisa a custom.ini).
;
; revalidate_freq=60: PHP revisa si un archivo cambio a lo mucho cada 60s,
; en vez de en cada request. Tras un deploy, los cambios tardan hasta 1
; minuto en verse (o reiniciar el contenedor app para efecto inmediato).
; No usamos validate_timestamps=0 porque el codigo entra por volumen, no
; horneado en la imagen: congelarlo del todo seria una trampa en deploys.
opcache.revalidate_freq = 60
